<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NAS ERP 구매요청 안내</title>
</head>
<body style="margin:0; padding:0; background-color:#f3f5f8; font-family:Arial, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color:#1f2937;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#f3f5f8;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:620px; background-color:#ffffff; border:1px solid #e5e7eb; border-radius:16px; overflow:hidden; box-shadow:0 8px 24px rgba(15,23,42,0.08);">
          <tr>
            <td style="padding:28px 32px; background-color:#1d4ed8; color:#ffffff;">
              <div style="font-size:13px; font-weight:700; letter-spacing:0.08em; opacity:0.85;">[NAS ERP 구매요청 안내]</div>
              <div style="margin-top:8px; font-size:24px; line-height:1.35; font-weight:700;">신규 구매요청이 등록되었습니다.</div>
            </td>
          </tr>
          <tr>
            <td style="padding:30px 32px 12px;">
              <div style="font-size:20px; line-height:1.45; font-weight:700; color:#111827;">${item_name}</div>
              <div style="margin-top:6px; font-size:13px; color:#6b7280;">요청 번호&nbsp; ${request_number}</div>
            </td>
          </tr>
          <tr>
            <td style="padding:12px 32px 8px;">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="border-collapse:separate; border-spacing:0; border:1px solid #e5e7eb; border-radius:12px; overflow:hidden;">
                <tr>
                  <td width="34%" style="padding:13px 16px; background:#f8fafc; border-bottom:1px solid #e5e7eb; font-size:13px; font-weight:700; color:#64748b;">수량</td>
                  <td style="padding:13px 16px; border-bottom:1px solid #e5e7eb; font-size:14px;">${quantity}</td>
                </tr>
                <tr>
                  <td style="padding:13px 16px; background:#f8fafc; border-bottom:1px solid #e5e7eb; font-size:13px; font-weight:700; color:#64748b;">예상금액</td>
                  <td style="padding:13px 16px; border-bottom:1px solid #e5e7eb; font-size:14px; font-weight:700; color:#1d4ed8;">${total_budget}</td>
                </tr>
                <tr>
                  <td style="padding:13px 16px; background:#f8fafc; border-bottom:1px solid #e5e7eb; font-size:13px; font-weight:700; color:#64748b;">긴급도</td>
                  <td style="padding:13px 16px; border-bottom:1px solid #e5e7eb; font-size:14px;">${urgency}</td>
                </tr>
                <tr>
                  <td style="padding:13px 16px; background:#f8fafc; border-bottom:1px solid #e5e7eb; font-size:13px; font-weight:700; color:#64748b;">요청자</td>
                  <td style="padding:13px 16px; border-bottom:1px solid #e5e7eb; font-size:14px;">${requester_name}</td>
                </tr>
                <tr>
                  <td style="padding:13px 16px; background:#f8fafc; border-bottom:1px solid #e5e7eb; font-size:13px; font-weight:700; color:#64748b;">부서</td>
                  <td style="padding:13px 16px; border-bottom:1px solid #e5e7eb; font-size:14px;">${department}</td>
                </tr>
                <tr>
                  <td style="padding:13px 16px; background:#f8fafc; font-size:13px; font-weight:700; color:#64748b;">등록시각</td>
                  <td style="padding:13px 16px; font-size:14px;">${request_date}</td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 32px 8px;">
              <div style="padding:18px; background:#f8fafc; border-left:4px solid #1d4ed8; border-radius:8px;">
                <div style="margin-top:8px; font-size:14px; line-height:1.7; color:#334155; white-space:pre-line;">${justification}</div>
              </div>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:20px 32px 34px;">
              <a href="http://localhost:18080/purchase-requests" style="display:inline-block; padding:13px 24px; background-color:#1d4ed8; border-radius:8px; color:#ffffff; font-size:14px; font-weight:700; text-decoration:none;">구매요청 확인하기</a>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:18px 24px; background:#f8fafc; border-top:1px solid #e5e7eb; font-size:12px; line-height:1.6; color:#94a3b8;">
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
